
services:
  postgres:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
    ports:
      - '5432:5432'
    networks:
      - postgres

  redis:
    image: redis
    ports:
      - '6379:6379'

networks:
  postgres:
    name: postgres